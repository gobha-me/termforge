name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gcc:
    name: GCC ${{ matrix.version }} (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [latest]
        version: [13, 14]
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC ${{ matrix.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++-${{ matrix.version }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang ${{ matrix.version }} (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [latest]
        # 19 is the first clang whose __cpp_concepts passes libstdc++'s
        # <expected> guard — 17/18 cannot compile std::expected at all.
        version: [19, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ matrix.version }}
        # llvm.sh picks the right distro codename and repo signing setup
        # (the old hand-rolled jammy repo + apt-key broke on noble runners).
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.version }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan-ubsan:
    name: ASan + UBSan (GCC, Ubuntu latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      # -fsanitize=address is absent here on purpose: it comes from the
      # toolchain file, which is what makes this job a live test of
      # cmake/toolchain/address.cmake. Inlining address alongside undefined
      # would still build sanitized, so a toolchain regression that drops the
      # flag would go unnoticed -- the silent-unsanitized-build bug #14 fixed.
      # Only the undefined half travels via CMAKE_CXX_FLAGS.
      - name: Configure (ASan + UBSan)
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/address.cmake
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  tsan:
    # #28 is the library's first supported cross-thread API. Build the whole
    # library instrumented, then run the focused production-loop suite that
    # posts concurrently while App drains on its loop thread.
    name: TSan (App::post, GCC, Ubuntu latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Configure (TSan)
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/thread.cmake
          -Dtermforge_EXAMPLES=OFF
          -Dtermforge_BIN=OFF

      - name: Build focused suite
        run: cmake --build build --target 54post-test -j$(nproc)

      - name: Test concurrent posting
        run: ctest --test-dir build -R '^54post-test$' --output-on-failure

  consume:
    # Issue #27's acceptance criteria: a minimal external project builds
    # against termforge both ways, on GCC and Clang, building only the library.
    # No other job exercises install/export or subproject consumption, so a
    # regression here is invisible to the rest of the matrix.
    name: Consume (${{ matrix.cc.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc:
          - { name: GCC 14,   kind: gcc,   version: 14, cxx: g++-14 }
          - { name: Clang 20, kind: clang, version: 20, cxx: clang++-20 }
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC ${{ matrix.cc.version }}
        if: matrix.cc.kind == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.cc.version }}

      - name: Install Clang ${{ matrix.cc.version }}
        if: matrix.cc.kind == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.cc.version }}

      # Zero extra options: proves bin/examples/tests default OFF off top level
      # and that no Catch2 is cloned into a consumer's tree.
      - name: add_subdirectory (zero options)
        run: tools/consume/run.sh subdir ${{ matrix.cc.cxx }}

      # Proves the exported target is spelled termforge::lib in this path too,
      # and that the headers land under ${prefix}/include/termforge.
      - name: install + find_package
        run: tools/consume/run.sh install ${{ matrix.cc.cxx }}

      # Vendored as a plain directory inside a repo with its own tags: proves
      # termforge reports its own version and not the host project's. Silent
      # when it breaks -- the build stays green and only the number is wrong.
      - name: add_subdirectory (vendored in a tagged repo)
        run: tools/consume/run.sh vendored ${{ matrix.cc.cxx }}

  fedora:
    name: GCC (Fedora latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - name: Install toolchain
        # Mirror TLS hiccups are common in fresh containers; retry a few
        # times before giving up.
        run: |
          for i in 1 2 3; do
            dnf install -y gcc-c++ cmake git make && break
            echo "dnf attempt $i failed; retrying in 15s" && sleep 15
          done
          gcc --version

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
